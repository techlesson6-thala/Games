<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Corner</title>
<style>
:root{--bg:#f3f1fb;--card:#fff;--ink:#1d1840;--mute:#6a6590;--acc:#5b3df5;--acc2:#ffb020;--ok:#1fa971;--bad:#e5484d;--line:#d9d4f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112e;--card:#221c47;--ink:#f1eeff;--mute:#a49fd0;--acc:#8d7bff;--acc2:#ffc23d;--ok:#3ddc97;--bad:#ff6b70;--line:#3a3270}}
:root[data-theme="dark"]{--bg:#15112e;--card:#221c47;--ink:#f1eeff;--mute:#a49fd0;--acc:#8d7bff;--acc2:#ffc23d;--ok:#3ddc97;--bad:#ff6b70;--line:#3a3270}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{font:800 2rem/1.1 "Arial Black","Trebuchet MS",sans-serif;margin:8px 0 4px;letter-spacing:-.5px}
p.sub{margin:0 0 18px;color:var(--mute)}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:12px 6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:700 .95rem inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
section{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
section[hidden]{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mute);font-weight:700}
.go{padding:10px 16px;border:0;border-radius:12px;background:var(--acc2);color:#2b1d00;font:800 .95rem inherit;font-family:inherit;cursor:pointer}
.grid{display:grid;gap:10px}
#mem{grid-template-columns:repeat(4,1fr)}
#ttt{grid-template-columns:repeat(3,1fr)}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:2rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cell.up{background:var(--card);border-color:var(--acc)}
.cell.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
#ttt .cell{font-size:2.6rem}
#ttt .cell.x{color:var(--acc)}#ttt .cell.o{color:var(--bad)}
.msg{min-height:1.6em;margin-top:14px;font-weight:800;text-align:center}
#pad{width:100%;height:200px;border:0;border-radius:18px;font:800 1.3rem inherit;font-family:inherit;color:#fff;background:var(--bad);cursor:pointer}
#pad.ready{background:var(--ok)}#pad.wait{background:var(--acc)}
@media(prefers-reduced-motion:no-preference){.cell{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
<h1>Game Corner</h1>
<p class="sub">Quick games. Tap a tab and play.</p>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="g1">Memory</button>
<button role="tab" aria-selected="false" data-t="g2">Tic-tac-toe</button>
<button role="tab" aria-selected="false" data-t="g3">Reaction</button>
</nav>

<section id="g1">
<div class="bar"><span>Moves: <b id="mv">0</b></span><button class="go" id="mnew">New game</button></div>
<div class="grid" id="mem"></div>
<div class="msg" id="mmsg"></div>
</section>

<section id="g2" hidden>
<div class="bar"><span>You are X</span><button class="go" id="tnew">New game</button></div>
<div class="grid" id="ttt"></div>
<div class="msg" id="tmsg"></div>
</section>

<section id="g3" hidden>
<div class="bar"><span>Best: <b id="best">–</b></span></div>
<button id="pad">Tap to start</button>
<div class="msg" id="rmsg">Wait for green, then tap fast.</div>
</section>
</main>

<script>
// Tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['g1','g2','g3'].forEach(id=>document.getElementById(id).hidden=id!==b.dataset.t);
});

// Memory
const mem=document.getElementById('mem');let first=null,lock=false,moves=0,pairs=0;
function mnew(){
  const e=['🐱','🚀','🍕','⚽','🎸','🌈'];const d=[...e,...e].sort(()=>Math.random()-.5);
  mem.innerHTML='';moves=0;pairs=0;first=null;lock=false;
  document.getElementById('mv').textContent=0;document.getElementById('mmsg').textContent='';
  d.forEach(v=>{const c=document.createElement('button');c.className='cell';c.dataset.v=v;c.setAttribute('aria-label','Card');c.onclick=()=>flip(c);mem.appendChild(c)});
}
function flip(c){
  if(lock||c.classList.contains('up')||c.classList.contains('done'))return;
  c.classList.add('up');c.textContent=c.dataset.v;
  if(!first){first=c;return}
  moves++;document.getElementById('mv').textContent=moves;
  if(first.dataset.v===c.dataset.v){
    first.classList.add('done');c.classList.add('done');first=null;pairs++;
    if(pairs===6)document.getElementById('mmsg').textContent='You won in '+moves+' moves!';
  }else{
    lock=true;const a=first;first=null;
    setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove('up');x.textContent=''});lock=false},750);
  }
}
document.getElementById('mnew').onclick=mnew;mnew();

// Tic-tac-toe
const ttt=document.getElementById('ttt'),tm=document.getElementById('tmsg');let B,over;
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function win(p){return L.some(l=>l.every(i=>B[i]===p))}
function draw(){[...ttt.children].forEach((c,i)=>{c.textContent=B[i]||'';c.className='cell '+(B[i]||'').toLowerCase()})}
function find(p){for(const l of L){const v=l.map(i=>B[i]);if(v.filter(x=>x===p).length===2&&v.includes(null))return l[v.indexOf(null)]}return -1}
function tnew(){
  B=Array(9).fill(null);over=false;tm.textContent='';ttt.innerHTML='';
  for(let i=0;i<9;i++){const c=document.createElement('button');c.className='cell';c.setAttribute('aria-label','Square '+(i+1));c.onclick=()=>play(i);ttt.appendChild(c)}
}
function end(){
  if(win('X')){tm.textContent='You win!';over=true}
  else if(win('O')){tm.textContent='Computer wins.';over=true}
  else if(B.every(Boolean)){tm.textContent='It’s a draw.';over=true}
  return over;
}
function play(i){
  if(over||B[i])return;B[i]='X';draw();if(end())return;
  let m=find('O');if(m<0)m=find('X');
  if(m<0&&!B[4])m=4;
  if(m<0){const f=B.map((v,k)=>v?null:k).filter(k=>k!==null);m=f[Math.floor(Math.random()*f.length)]}
  B[m]='O';draw();end();
}
document.getElementById('tnew').onclick=tnew;tnew();

// Reaction
const pad=document.getElementById('pad'),rm=document.getElementById('rmsg');let st='idle',t0,to,best=null;
pad.onclick=()=>{
  if(st==='idle'){
    st='wait';pad.className='wait';pad.textContent='Wait…';rm.textContent='';
    to=setTimeout(()=>{st='go';pad.className='ready';pad.textContent='TAP!';t0=performance.now()},1000+Math.random()*2500);
  }else if(st==='wait'){
    clearTimeout(to);st='idle';pad.className='';pad.textContent='Tap to try again';rm.textContent='Too soon! Wait for green.';
  }else{
    const ms=Math.round(performance.now()-t0);st='idle';pad.className='';pad.textContent='Tap to try again';
    rm.textContent=ms+' ms';
    if(best===null||ms<best){best=ms;document.getElementById('best').textContent=ms+' ms'}
  }
};
</script>
</body>
</html>
